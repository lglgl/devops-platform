# Registry 通过 NGINX 统一入口暴露。
# 注意：Ingress 与 backend Service 必须在同一 namespace (infra)。
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: registry
  namespace: infra
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /registry
            pathType: Prefix
            backend:
              service:
                name: registry
                port:
                  number: 5000
