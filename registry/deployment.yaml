apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: infra
  labels:
    app.kubernetes.io/name: registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: registry
  template:
    metadata:
      labels:
        app.kubernetes.io/name: registry
    spec:
      containers:
        - name: registry
          image: registry:2
          ports:
            - containerPort: 5000
              name: registry
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: storage
              mountPath: /var/lib/registry
      volumes:
        # 本地 Lab 用 emptyDir；生产建议 PVC / 对象存储。
        - name: storage
          emptyDir: {}
