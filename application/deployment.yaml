apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-sample
  namespace: app-sample
  labels:
    app.kubernetes.io/name: app-sample
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: app-sample
  template:
    metadata:
      labels:
        app.kubernetes.io/name: app-sample
    spec:
      containers:
        - name: app
          # 示例应用：替换为真实业务镜像。
          image: nginx:alpine
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
