# ============================================================
# SRE Platform Dashboard
#
# 更新首页：
#   http://localhost:30080/
#
# 5 个分类：
#   监控 Monitoring   : Grafana / Prometheus / Alertmanager
#   日志 Logs & Trace : Loki / Alloy / Tempo
#   CICD / GitOps     : Jenkins / Argo CD
#   APP 应用          : Application / Registry (规划中)
#   其它 Other        : Ingress 网关
# ============================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-dashboard-html
  namespace: observability
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="zh-CN">
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>SRE Platform</title>
      <style>
        * { box-sizing: border-box; }
        body {
          margin: 0;
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
          background: #0f172a;
          color: #e5e7eb;
        }
        .container {
          max-width: 1100px;
          margin: 0 auto;
          padding: 48px 24px;
        }
        header { margin-bottom: 40px; }
        h1 { margin: 0 0 10px; font-size: 36px; }
        .subtitle { color: #94a3b8; font-size: 16px; }
        .section { margin-top: 36px; }
        .section-title {
          margin-bottom: 16px;
          font-size: 20px;
          font-weight: 600;
        }
        .grid {
          display: grid;
          grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
          gap: 16px;
        }
        .card {
          display: block;
          padding: 22px;
          border: 1px solid #334155;
          border-radius: 12px;
          background: #111827;
          color: inherit;
          text-decoration: none;
          transition: transform .15s ease, border-color .15s ease;
        }
        .card:hover {
          transform: translateY(-2px);
          border-color: #64748b;
        }
        .card.disabled {
          opacity: 0.55;
          cursor: default;
        }
        .card.disabled:hover {
          transform: none;
          border-color: #334155;
        }
        .name {
          font-size: 18px;
          font-weight: 600;
          margin-bottom: 8px;
        }
        .description {
          color: #94a3b8;
          line-height: 1.5;
          font-size: 14px;
        }
        .status {
          display: inline-block;
          margin-top: 14px;
          padding: 4px 8px;
          border-radius: 6px;
          background: #172554;
          color: #93c5fd;
          font-size: 12px;
        }
        .status.planned {
          background: #3f2d0a;
          color: #fcd34d;
        }
        footer {
          margin-top: 48px;
          color: #64748b;
          font-size: 13px;
        }
      </style>
    </head>
    <body>
      <main class="container">

        <header>
          <h1>SRE Platform</h1>
          <div class="subtitle">Kubernetes · CI/CD · GitOps · Observability</div>
        </header>

        <!-- ===================== 监控 Monitoring ===================== -->
        <section class="section">
          <div class="section-title">监控 · Monitoring</div>
          <div class="grid">

            <a class="card" href="/grafana/">
              <div class="name">Grafana</div>
              <div class="description">Metrics / Logs / Traces 统一可视化入口。</div>
              <span class="status">Dashboard</span>
            </a>

            <a class="card" href="/prometheus/">
              <div class="name">Prometheus</div>
              <div class="description">Metrics 采集、PromQL 与告警规则。</div>
              <span class="status">Metrics</span>
            </a>

            <a class="card" href="/alertmanager/">
              <div class="name">Alertmanager</div>
              <div class="description">Prometheus 告警聚合、路由与通知。</div>
              <span class="status">Alerting</span>
            </a>

          </div>
        </section>

        <!-- ===================== 日志 Logs & Trace ===================== -->
        <section class="section">
          <div class="section-title">日志 · Logs &amp; Trace</div>
          <div class="grid">

            <a class="card" href="/grafana/explore">
              <div class="name">Loki</div>
              <div class="description">日志存储后端，Grafana → Explore → Loki 查看。</div>
              <span class="status">Logs</span>
            </a>

            <a class="card" href="/grafana/explore">
              <div class="name">Alloy</div>
              <div class="description">日志采集 Agent：K8s API → Loki Push。</div>
              <span class="status">Collector</span>
            </a>

            <a class="card" href="/grafana/explore">
              <div class="name">Tempo</div>
              <div class="description">分布式链路追踪后端 (OTLP gRPC/HTTP)。</div>
              <span class="status">Tracing</span>
            </a>

          </div>
        </section>

        <!-- ===================== CICD / GitOps ===================== -->
        <section class="section">
          <div class="section-title">CICD · GitOps</div>
          <div class="grid">

            <a class="card" href="/jenkins/">
              <div class="name">Jenkins</div>
              <div class="description">CI Pipeline、构建、测试与 K8s 动态 Agent。</div>
              <span class="status">CI</span>
            </a>

            <a class="card" href="/argocd/">
              <div class="name">Argo CD</div>
              <div class="description">GitOps 持续交付与 Kubernetes 应用同步。</div>
              <span class="status">GitOps</span>
            </a>

          </div>
        </section>

        <!-- ===================== APP 应用 ===================== -->
        <section class="section">
          <div class="section-title">APP · 应用</div>
          <div class="grid">

            <a class="card" href="/application/">
              <div class="name">Application</div>
              <div class="description">业务应用示例 (nginx)，部署见 application/。</div>
              <span class="status">app</span>
            </a>

            <a class="card" href="/registry/">
              <div class="name">Registry</div>
              <div class="description">镜像仓库 (registry:2)，部署见 registry/。</div>
              <span class="status">infra</span>
            </a>

          </div>
        </section>

        <!-- ===================== 其它 Other ===================== -->
        <section class="section">
          <div class="section-title">其它 · Other</div>
          <div class="grid">

            <a class="card" href="#">
              <div class="name">Ingress 网关</div>
              <div class="description">NGINX 统一入口：HTTP 30080 / HTTPS 30443。</div>
              <span class="status">Gateway</span>
            </a>

          </div>
        </section>

        <footer>SRE Platform · Docker Desktop Kubernetes</footer>

      </main>
    </body>
    </html>
